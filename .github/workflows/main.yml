name: Build and Package APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Build Prerequisites
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            echo "GEMINI_API_KEY=MY_KEY" > .env
          fi
          chmod +x gradlew 2>/dev/null || true

      - name: Compile and Assemble APK
        uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleDebug -Djava.awt.headless=true --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BilimTest-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
